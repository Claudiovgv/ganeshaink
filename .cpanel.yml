---
deployment:
  tasks:
    # Backend — instalar deps + correr migrações
    - export DEPLOYPATH=$HOME/ganeshaink/backend
    - cd $DEPLOYPATH && npm install --omit=dev
    - cd $DEPLOYPATH && node prisma/migrate.js
    # Frontend — instalar deps + compilar
    - export DEPLOYPATH=$HOME/ganeshaink/frontend
    - cd $DEPLOYPATH && npm install
    - cd $DEPLOYPATH && npm run build
    # Reiniciar apps (Passenger)
    - mkdir -p $HOME/ganeshaink/backend/tmp && touch $HOME/ganeshaink/backend/tmp/restart.txt
    - mkdir -p $HOME/ganeshaink/frontend/tmp && touch $HOME/ganeshaink/frontend/tmp/restart.txt
