---
deployment:
  tasks:
    - cd /home/ganesha/ganeshaink/backend && npm install --omit=dev
    - cd /home/ganesha/ganeshaink/backend && node prisma/migrate.js
    - cd /home/ganesha/ganeshaink/frontend && npm install
    - cd /home/ganesha/ganeshaink/frontend && npm run build
    - mkdir -p /home/ganesha/ganeshaink/backend/tmp && touch /home/ganesha/ganeshaink/backend/tmp/restart.txt
    - mkdir -p /home/ganesha/ganeshaink/frontend/tmp && touch /home/ganesha/ganeshaink/frontend/tmp/restart.txt
