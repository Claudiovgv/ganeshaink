---
deployment:
  tasks:
    - /bin/sh -c "cd $HOME/ganeshaink/backend && npm install --omit=dev"
    - /bin/sh -c "cd $HOME/ganeshaink/backend && node prisma/migrate.js"
    - /bin/sh -c "cd $HOME/ganeshaink/frontend && npm install"
    - /bin/sh -c "cd $HOME/ganeshaink/frontend && npm run build"
    - /bin/sh -c "mkdir -p $HOME/ganeshaink/backend/tmp && touch $HOME/ganeshaink/backend/tmp/restart.txt"
    - /bin/sh -c "mkdir -p $HOME/ganeshaink/frontend/tmp && touch $HOME/ganeshaink/frontend/tmp/restart.txt"
